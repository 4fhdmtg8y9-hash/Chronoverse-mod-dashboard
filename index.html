<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moderator Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
body {
  min-height: 100vh;
  background: #0d0d12;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
}
.container {
  width: 90%;
  max-width: 500px;
  background: #17171f;
  border: 1px solid #292936;
  border-radius: 20px;
  padding: 40px 30px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,.4);
}
.logo {
  width: 80px;
  height: 80px;
  margin: 0 auto 20px;
  border-radius: 50%;
  background: #5865F2;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 38px;
  font-weight: bold;
}
h1 {
  font-size: 28px;
  margin-bottom: 10px;
}
p {
  color: #a7a7b3;
  line-height: 1.5;
  margin-bottom: 30px;
}
button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 10px;
  background: #5865F2;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
button:hover {
  opacity: .9;
}
.small {
  margin-top: 20px;
  font-size: 12px;
  color: #777783;
}
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">D</div>
<h1>Moderator Dashboard</h1>
<p>
  Log in with Discord to access the moderation dashboard
  and record your moderation actions.
</p>
<button onclick="login()">
  Continue with Discord
</button>
<div class="small">
  Authorized moderators only
</div>
  </div>
  <script>
    function login() {
  window.location.href = "/api/auth/discord";
}
    }
  </script>
</body>
</html>
