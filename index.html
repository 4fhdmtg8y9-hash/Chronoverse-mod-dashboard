<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chronoverse Moderator Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      min-height: 100vh;
      background: #0d0d12;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: #17171f;
      border: 1px solid #292936;
      border-radius: 18px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }
    .icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 20px;
      border-radius: 18px;
      background: #5865F2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }
    .subtitle {
      color: #92929f;
      line-height: 1.5;
      margin-bottom: 30px;
    }
    .discord-button {
      display: block;
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      background: #5865F2;
      color: white;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      transition: opacity 0.2s, transform 0.2s;
    }
    .discord-button:hover {
      opacity: 0.9;
    }
    .discord-button:active {
      transform: scale(0.98);
    }
    .notice {
      margin-top: 20px;
      font-size: 13px;
      color: #6f6f7c;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="icon">
      🛡️
    </div>
    <h1>Moderator Login</h1>
    <p class="subtitle">
      Sign in with your Discord account to access
      the Marvel Chronoverse Moderator Dashboard.
    </p>
    <a href="/api/auth/discord" class="discord-button">
      Connect with Discord
    </a>
    <p class="notice">
      Access is restricted to approved Chronoverse staff members.
    </p>
  </div>
</body>
</html>
