<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chronoverse Moderator Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0d0d12;
      color: white;
      padding: 25px 15px;
    }

    .dashboard {
      max-width: 850px;
      margin: auto;
    }

    header {
      background: #17171f;
      border: 1px solid #292936;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 27px;
      margin-bottom: 8px;
    }

    header p {
      color: #92929f;
    }

    #loggedInAs {
      margin-top: 12px;
      color: #5865F2;
      font-weight: bold;
    }

    .card {
      background: #17171f;
      border: 1px solid #292936;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 20px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      background: #0d0d12;
      color: white;
      border: 1px solid #30303d;
      border-radius: 9px;
      padding: 13px;
      margin-bottom: 20px;
      font-size: 15px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #5865F2;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .upload-box {
      border: 1px dashed #454552;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
      text-align: center;
      background: #111117;
    }

    .upload-button {
      display: inline-block;
      background: #5865F2;
      color: white;
      padding: 12px 18px;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    #evidenceInput {
      display: none;
    }

    #fileName {
      margin-top: 12px;
      color: #92929f;
      font-size: 14px;
      word-break: break-word;
    }

    #preview {
      display: none;
      max-width: 100%;
      max-height: 300px;
      margin: 15px auto 0;
      border-radius: 10px;
      border: 1px solid #30303d;
    }

    .remove-photo {
      display: none;
      margin: 10px auto 0;
      background: transparent;
      border: 1px solid #454552;
      color: #aaa;
      padding: 8px 14px;
      width: auto;
      font-size: 13px;
    }

    button.submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #5865F2;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 15px;
      text-align: center;
      color: #aaa;
      line-height: 1.5;
    }

    .logout {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #92929f;
      text-decoration: none;
      font-size: 14px;
    }

    .logout:hover {
      color: white;
    }

    .history-item {
      background: #0d0d12;
      border: 1px solid #30303d;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .history-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .history-action {
      font-weight: bold;
    }

    .history-date {
      color: #92929f;
      font-size: 13px;
    }

    .history-user {
      color: #aaa;
      margin-bottom: 8px;
    }

    .history-reason {
      color: #ddd;
      line-height: 1.4;
    }

    .history-case {
      margin-top: 10px;
      color: #5865F2;
      font-weight: bold;
    }

    .empty-history {
      color: #92929f;
    }

    .error-history {
      color: #ED4245;
    }
  </style>
</head>

<body>

  <div class="dashboard">

    <header>

      <h1>
        🛡️ Chronoverse Moderator Dashboard
      </h1>

      <p>
        Record and manage your moderation actions.
      </p>

      <div id="loggedInAs">
        Checking Discord account...
      </div>

    </header>


    <!-- MODERATION ACTION -->

    <div class="card">

      <h2>
        Log Moderation Action
      </h2>


      <label for="action">
        Moderation Action
      </label>

      <select id="action">

        <option value="Warn">
          ⚠️ Warn
        </option>

        <option value="Kick">
          👢 Kick
        </option>

        <option value="Ban">
          🔨 Ban
        </option>

        <option value="Unban">
          🔓 Unban
        </option>

        <option value="Timeout">
          ⏱️ Timeout
        </option>

        <option value="Note">
          📝 Moderation Note
        </option>

      </select>


      <label for="userId">
        User ID
      </label>

      <input
        id="userId"
        type="text"
        placeholder="Enter Discord User ID"
      >


      <label for="username">
        Username
      </label>

      <input
        id="username"
        type="text"
        placeholder="Enter Discord username"
      >


      <label for="reason">
        Reason
      </label>

      <textarea
        id="reason"
        placeholder="Enter the reason for this action..."
      ></textarea>


      <label>
        📸 Evidence
      </label>

      <div class="upload-box">

        <label
          for="evidenceInput"
          class="upload-button"
        >
          📷 Choose Photo
        </label>

        <input
          id="evidenceInput"
          type="file"
          accept="image/*"
        >

        <div id="fileName">
          No photo selected
        </div>

        <img
          id="preview"
          alt="Evidence preview"
        >

        <button
          type="button"
          id="removePhoto"
          class="remove-photo"
          onclick="removeEvidence()"
        >
          Remove Photo
        </button>

      </div>


      <button
        id="submitButton"
        class="submit"
        onclick="submitAction()"
      >
        Submit Moderation Log
      </button>


      <div id="status"></div>

    </div>


    <!-- MODERATION HISTORY -->

    <div class="card">

      <h2>
        📋 My Moderation History
      </h2>

      <div id="history">
        Loading moderation history...
      </div>

    </div>


    <a
      class="logout"
      href="/"
    >
      Log out
    </a>

  </div>


  <script>

    let selectedEvidence = null;


    // =========================
    // LOAD DISCORD MODERATOR
    // =========================

    async function loadModerator() {

      const loggedInAs =
        document.getElementById("loggedInAs");

      try {

        const response =
          await fetch("/api/auth/me");

        const data =
          await response.json();

        if (!response.ok) {

          loggedInAs.textContent =
            "Not logged in";

          return;
        }

        loggedInAs.textContent =
          "Logged in as @" + data.username;

      } catch (error) {

        loggedInAs.textContent =
          "Unable to load Discord account.";

      }

    }


    // =========================
    // PHOTO SELECTION
    // =========================

    document
      .getElementById("evidenceInput")
      .addEventListener(
        "change",
        function(event) {

          const file =
            event.target.files[0];

          if (!file) {
            return;
          }


          if (!file.type.startsWith("image/")) {

            alert(
              "Please select an image."
            );

            event.target.value = "";

            return;
          }


          if (
            file.size >
            8 * 1024 * 1024
          ) {

            alert(
              "Please choose an image smaller than 8 MB."
            );

            event.target.value = "";

            return;
          }


          selectedEvidence = file;


          document
            .getElementById("fileName")
            .textContent =
            file.name;


          const preview =
            document.getElementById(
              "preview"
            );


          preview.src =
            URL.createObjectURL(file);


          preview.style.display =
            "block";


          document
            .getElementById(
              "removePhoto"
            )
            .style.display =
            "block";

        }
      );


    // =========================
    // REMOVE PHOTO
    // =========================

    function removeEvidence() {

      selectedEvidence = null;


      document
        .getElementById(
          "evidenceInput"
        )
        .value = "";


      document
        .getElementById(
          "fileName"
        )
        .textContent =
        "No photo selected";


      document
        .getElementById(
          "preview"
        )
        .style.display =
        "none";


      document
        .getElementById(
          "preview"
        )
        .src = "";


      document
        .getElementById(
          "removePhoto"
        )
        .style.display =
        "none";

    }


    // =========================
    // SUBMIT MODERATION ACTION
    // =========================

    async function submitAction() {

      const button =
        document.getElementById(
          "submitButton"
        );


      const status =
        document.getElementById(
          "status"
        );


      const action =
        document.getElementById(
          "action"
        ).value;


      const userId =
        document.getElementById(
          "userId"
        ).value.trim();


      const username =
        document.getElementById(
          "username"
        ).value.trim();


      const reason =
        document.getElementById(
          "reason"
        ).value.trim();


      if (
        !userId ||
        !username ||
        !reason
      ) {

        status.textContent =
          "Please enter a User ID, username, and reason.";

        return;
      }


      button.disabled = true;


      status.textContent =
        "Sending moderation log...";


      try {

        const formData =
          new FormData();


        formData.append(
          "action",
          action
        );


        formData.append(
          "userId",
          userId
        );


        formData.append(
          "username",
          username
        );


        formData.append(
          "reason",
          reason
        );


        if (selectedEvidence) {

          formData.append(
            "evidence",
            selectedEvidence
          );

        }


        const response =
          await fetch(
            "/api/log-action",
            {
              method: "POST",
              body: formData
            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Something went wrong."
          );

        }


        status.textContent =
          "✓ Moderation action logged successfully. Case " +
          data.caseId;


        document
          .getElementById(
            "userId"
          )
          .value = "";


        document
          .getElementById(
            "username"
          )
          .value = "";


        document
          .getElementById(
            "reason"
          )
          .value = "";


        removeEvidence();


        // Refresh history
        loadHistory();

      } catch (error) {

        status.textContent =
          "Error: " +
          error.message;

      } finally {

        button.disabled = false;

      }

    }


    // =========================
    // LOAD MODERATION HISTORY
    // =========================

    async function loadHistory() {

      const history =
        document.getElementById(
          "history"
        );


      try {

        const response =
          await fetch(
            "/api/my-actions"
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Unable to load history."
          );

        }


        if (
          !data.actions ||
          data.actions.length === 0
        ) {

          history.innerHTML =
            `
              <p class="empty-history">
                No moderation actions yet.
              </p>
            `;

          return;
        }


        history.innerHTML =
          data.actions
            .map(action => {

              return `

                <div class="history-item">

                  <div class="history-top">

                    <div class="history-action">
                      ${escapeHtml(
                        action.action_type
                      )}
                    </div>

                    <div class="history-date">
                      ${new Date(
                        action.created_at
                      ).toLocaleString()}
                    </div>

                  </div>


                  <div class="history-user">

                    User ID:
                    ${escapeHtml(
                      action.target_discord_id ||
                      "Unknown"
                    )}

                  </div>


                  <div class="history-reason">

                    ${escapeHtml(
                      action.reason ||
                      "No reason provided."
                    )}

                  </div>


                  <div class="history-case">

                    ${escapeHtml(
                      action.case_id ||
                      "No Case ID"
                    )}

                  </div>

                </div>

              `;

            })
            .join("");

      } catch (error) {

        history.innerHTML =
          `
            <p class="error-history">
              Error: ${escapeHtml(
                error.message
              )}
            </p>
          `;

      }

    }


    // =========================
    // SECURITY
    // =========================

    function escapeHtml(value) {

      const div =
        document.createElement(
          "div"
        );

      div.textContent =
        value;

      return div.innerHTML;

    }


    // =========================
    // START
    // =========================

    loadModerator();

    loadHistory();

  </script>

</body>
</html>
